name: Build Mi Pad 2 Snapshot
run-name: Mi Pad 2 7.2 Snapshot replay (${{ inputs.variant }})

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build the installed 15fps preview or an isolated camera candidate'
        required: true
        default: preview15
        type: choice
        options: [preview15, preview-conversion, capture-pool, direct-nv12]

permissions:
  contents: read

concurrency:
  group: snapshot-72-replay-${{ inputs.variant }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Resolve the published Snapshot source
        id: source
        shell: bash
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          prefix=/usr/local/lib/mipad2-camera-preview15
          case "$VARIANT" in
            preview15) source=18ce2f64348d521993a322e0244a49cdeaaa0b9f ;;
            preview-conversion) source=1c8204ae39fb34bca7cf7b670efabcb991fcc87b ;;
            capture-pool)
              source=1e13361f8dc7955d13876bee46be56415b028854
              prefix=/usr/local/lib/mipad2-camera-capture-pool
              ;;
            direct-nv12) source=bc843a84661e5816524768017070107df1446d77 ;;
            *) exit 1 ;;
          esac
          printf 'sha=%s\nprefix=%s\n' "$source" "$prefix" >> "$GITHUB_OUTPUT"
      - name: Checkout the pinned source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Build and test the selected variant from scratch on Arch
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          INSTALL_PREFIX: ${{ steps.source.outputs.prefix }}
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          docker pull archlinux:base-devel
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' archlinux:base-devel)"
          mkdir dist
          printf '%s\n' "$image" > dist/arch-builder-image.txt
          docker run --rm -i -e SOURCE_SHA -e INSTALL_PREFIX -e VARIANT \
            -e CARGO_BUILD_JOBS=2 -e CARGO_TERM_COLOR=never \
            -v "$GITHUB_WORKSPACE:/work" -w /work "$image" bash -se <<'ARCH_BUILD'
              set -euo pipefail
              pacman -Syu --noconfirm --needed \
                git rust meson ninja pkgconf gettext desktop-file-utils appstream \
                snapshot v4l-utils gst-plugins-good zstd
              meson setup build --prefix="$INSTALL_PREFIX" --buildtype=release -Dx11=disabled
              # Meson deliberately isolates Cargo from the container's default cache.
              export CARGO_HOME=/work/build/cargo-home
              cargo fetch --locked --target x86_64-unknown-linux-gnu
              export CARGO_NET_OFFLINE=true
              meson compile -C build -j2
              CARGO_TARGET_DIR=/work/build/cargo-target cargo test --locked --offline \
                --release -p aperture --lib mipad2_preview::
              DESTDIR="$PWD/pkgroot" meson install -C build --no-rebuild
              test -x "pkgroot$INSTALL_PREFIX/bin/snapshot"
              mkdir -p dist
              archive="snapshot-mipad2-72-$VARIANT.tar.zst"
              tar --zstd -C pkgroot -cf "dist/$archive" "${INSTALL_PREFIX#/}"
              sha256sum "pkgroot$INSTALL_PREFIX/bin/snapshot" > dist/binary.sha256
              printf "%s\n" "$SOURCE_SHA" > dist/source-commit.txt
              pacman -Q > dist/build-packages.txt
              (cd dist; sha256sum "$archive" > "$archive.sha256"; sha256sum -c "$archive.sha256")
          ARCH_BUILD
      - name: Upload the package and reproducibility receipt
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-mipad2-72-${{ inputs.variant }}-${{ steps.source.outputs.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

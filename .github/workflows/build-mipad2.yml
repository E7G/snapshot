name: Build Mi Pad 2 Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - mipad2-camera
      - mipad2-camera-51

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in Arch Linux
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -e CARGO_TERM_COLOR=always \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            archlinux:base-devel \
            bash -lc '
              set -euxo pipefail
              pacman -Syu --noconfirm --needed \
                git rust meson ninja pkgconf gettext desktop-file-utils appstream \
                snapshot v4l-utils gst-plugins-good zstd

              rustc --version
              cargo --version
              meson --version
              pkg-config --modversion gtk4 libadwaita-1 gstreamer-1.0

              meson setup build --prefix=/usr --buildtype=release
              ninja -C build -j"$(nproc)"

              rm -rf pkgroot dist
              DESTDIR="$PWD/pkgroot" meson install -C build --no-rebuild
              test -x pkgroot/usr/bin/snapshot

              version="$(sed -n "s/.*version: '\''\([^'\'']*\)'\''.*/\1/p" meson.build | head -n1)"
              test -n "$version"
              artifact="snapshot-mipad2-$version-x86_64.tar.zst"
              mkdir -p dist
              tar --zstd -C pkgroot -cf "dist/$artifact" usr
              sha256sum "dist/$artifact" > "dist/$artifact.sha256"
              printf "%s\n" "$artifact" > dist/artifact-name.txt
            '

      - name: Show artifact contents
        shell: bash
        run: |
          artifact="$(cat dist/artifact-name.txt)"
          ls -lh dist/
          tar --zstd -tf "dist/$artifact" | sed -n '1,80p'

      - name: Upload Mi Pad 2 build
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-mipad2
          path: dist/
          if-no-files-found: error
          compression-level: 0
